<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="410" height="176" viewBox="0 0 410 176" role="img" aria-label="casascalea.it: Real-estate platform in Calabria. Listings with map search and favorites in EN / RU / IT, backed by its own API."><style>@font-face{font-family:RuffletMono;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:RuffletMono;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
:root{--bg:#ffffff;--border:#d0d7de;--bar:#f6f8fa;--text:#1f2328;--muted:#59636e;--accent:#c4532f;--green:#1a7f37;--cyan:#0a7ea4;--purple:#8250df;--yellow:#9a6700;--g0:#e2603f;--g1:#8b5cf6}
@media (prefers-color-scheme:dark){:root{--bg:#0f131a;--border:#2a313c;--bar:#151a22;--text:#e6edf3;--muted:#7d8590;--accent:#e8825f;--green:#3fb950;--cyan:#56d4dd;--purple:#bc8cff;--yellow:#e3b341;--g0:#ff8a65;--g1:#c084fc}}
text{font-family:RuffletMono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:var(--text);white-space:pre}
.b{font-weight:700}.sm{font-size:12px}
.m{fill:var(--muted)}.ac{fill:var(--accent)}.g{fill:var(--green)}.c{fill:var(--cyan)}.p{fill:var(--purple)}.y{fill:var(--yellow)}.t{fill:var(--text)}
.bg{fill:var(--bg)}.bar{fill:var(--bar)}.bd{stroke:var(--border)}.acs{stroke:var(--accent);stroke-width:1.5}.nf{fill:none}
.logo{fill:url(#logo-grad)}.s0{stop-color:var(--g0)}.s1{stop-color:var(--g1)}
.a{opacity:0;animation:in .32s ease-out forwards}
.tmp{opacity:0;animation:in .2s ease-out forwards,out .15s ease-in forwards}
.blink{animation:blink 1.06s steps(1) infinite}
.pulse{animation:pulse .7s ease-in-out infinite}
.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
@keyframes type{to{transform:translateX(var(--w))}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .a{opacity:1}
  .tmp,.typer{display:none}
